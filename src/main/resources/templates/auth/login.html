<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Log In</title>
</head>

<th:block layout:fragment="body">
<div class="centered">
    <div class="container-sm">
        <a class="logo" href="/"><img th:src="@{/favicon.svg}" alt="Komm logo"> Komm</a>
        <div class="card">
            <h2 style="font-size:20px; font-weight:700; margin-bottom:6px; text-align:center;">Welcome back</h2>
            <p style="color:var(--fg-subtle); font-size:13px; text-align:center; margin-bottom:20px;">We're so excited to see you again!</p>

            <form method="post" th:action="@{/login}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-icon-wrap">
                        <i class="mdi mdi-account-outline"></i>
                        <input type="text" name="username" th:value="${username}" placeholder="Enter your username" autocomplete="username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon-wrap">
                        <i class="mdi mdi-lock-outline"></i>
                        <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>
                    <p style="font-size:12px; margin-top:6px;">
                        <a class="inline-link" href="/forgot-password">Forgot your password?</a>
                    </p>
                </div>
                <div class="form-group">
                    <label style="display:flex; align-items:center; gap:6px; font-weight:400;">
                        <input type="checkbox" name="rememberMe" style="width:auto;"> Remember me
                    </label>
                </div>
                <button class="btn btn-primary" type="submit"><i class="mdi mdi-login"></i> Log In</button>
                <div class="error-msg" th:if="${error}" th:text="${error}" style="display:block;"></div>
            </form>
        </div>
        <div class="link-row">
            Need an account? <a href="/register">Register</a>
        </div>
    </div>
</div>
</th:block>
</html>
