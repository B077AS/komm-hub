<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <script th:src="@{/js/htmx.min.js}" defer></script>
</head>

<th:block layout:fragment="body">

<nav class="navbar">
    <div class="navbar-content">
        <a class="nav-logo" href="/"><img th:src="@{/favicon.svg}" alt="Komm logo"> Komm</a>
        <div class="nav-user-menu">
            <button type="button" class="nav-user-trigger" id="navUserMenuButton"
                    aria-haspopup="true" aria-expanded="false" aria-controls="navUserDropdownMenu">
                <span class="nav-user-avatar">
                    <img th:if="${user.avatar}"
                         th:src="'data:image/' + ${user.avatarImageFormat ?: 'png'} + ';base64,' + ${user.avatar}"
                         alt="">
                    <span th:unless="${user.avatar}"
                          th:text="${#strings.isEmpty(user.username) ? '?' : #strings.toUpperCase(#strings.substring(user.username,0,1))}"></span>
                </span>
                <i class="mdi mdi-chevron-down"></i>
            </button>

            <div class="nav-user-dropdown" id="navUserDropdownMenu">
                <div class="nav-user-dropdown-name" th:text="${user.username}">username</div>
                <div class="nav-user-dropdown-divider"></div>
                <form method="post" th:action="@{/logout}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="nav-user-dropdown-item">
                        <i class="mdi mdi-logout"></i> Log out
                    </button>
                </form>
            </div>
        </div>

        <!-- Mobile: opens the dashboard section nav as an off-canvas sidebar,
             same slide-in-from-the-right pattern as the public site's navbar. -->
        <button type="button" class="dash-mobile-toggle" id="dashMobileToggle" aria-label="Toggle dashboard menu"
                aria-expanded="false" aria-controls="dashSidebar">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>

    <script>
        (function () {
            const userMenuButton = document.getElementById('navUserMenuButton');
            const userDropdownMenu = document.getElementById('navUserDropdownMenu');
            if (!userMenuButton || !userDropdownMenu) return;

            userMenuButton.addEventListener('click', function (e) {
                e.stopPropagation();
                const open = userDropdownMenu.classList.toggle('open');
                userMenuButton.setAttribute('aria-expanded', open ? 'true' : 'false');
            });

            document.addEventListener('click', function (e) {
                if (!userMenuButton.contains(e.target) && !userDropdownMenu.contains(e.target)) {
                    userDropdownMenu.classList.remove('open');
                    userMenuButton.setAttribute('aria-expanded', 'false');
                }
            });
        })();
    </script>
</nav>

<div class="dash-sidebar-backdrop" id="dashSidebarBackdrop"></div>

<div class="page-scroll">
<div class="page-content">
<!-- hx-target/hx-swap set once here - every hx-get/hx-post underneath
     (sidebar links, the four admin action forms) inherits them unless it
     overrides its own, so #dash-content is the one thing that ever swaps. -->
<div class="dash-layout" hx-target="#dash-content" hx-swap="innerHTML">
    <!-- hx-target/hx-swap set again here, not just inherited from .dash-layout
         above: on mobile this nav gets reparented into .navbar while open (see
         the JS below), which takes it out of .dash-layout's subtree entirely -
         htmx would otherwise lose the inherited target and swap each section's
         markup into the clicked link itself instead of #dash-content. -->
    <nav class="dash-sidebar" id="dashSidebar" aria-label="Dashboard sections"
         hx-target="#dash-content" hx-swap="innerHTML">
        <a href="#profile" class="dash-nav-link active" data-section="profile"
           th:attr="hx-get=@{/dashboard/section/profile}, hx-push-url=(@{/dashboard} + '#profile')">
            <i class="mdi mdi-account-outline"></i> Profile
        </a>

        <th:block th:if="${isAdmin}">
            <div class="dash-nav-group">Super admin</div>
            <a href="#beta-keys" class="dash-nav-link" data-section="beta-keys"
               th:attr="hx-get=@{/dashboard/section/beta-keys}, hx-push-url=(@{/dashboard} + '#beta-keys')">
                <i class="mdi mdi-key-chain-variant"></i> Beta keys
            </a>
            <a href="#badges" class="dash-nav-link" data-section="badges"
               th:attr="hx-get=@{/dashboard/section/badges}, hx-push-url=(@{/dashboard} + '#badges')">
                <i class="mdi mdi-seal"></i> Badges
            </a>
        </th:block>
    </nav>

    <!-- Swap target: only the currently chosen section lives here, fetched
         from dashboard-fragments.html. Profile is inserted directly for the
         first paint so a plain GET /dashboard still renders a complete page
         with no extra round trip. -->
    <div class="dash-main" id="dash-content">
        <div th:replace="~{dashboard-fragments :: profile}"></div>
    </div>
</div>
</div>
</div>

<script>
    // Everything above is server-rendered - the only client-side JS left is UI-local
    // (clipboard copy, the icon picker's live search) or one lazy, session-cookie-
    // authenticated lookup for the large icon catalog. No bearer token anywhere.

    // Off-canvas dashboard sidebar - identical shape to the public site's
    // mobile nav (toggle + backdrop + Escape + close-on-link-click), just
    // pointed at .dash-sidebar/.page-scroll instead of .site-navbar-links/
    // .site-main. This has to live down here rather than next to the toggle
    // button in the navbar above: that inline <script> runs while the parser
    // is still inside <nav>, before #dashSidebar (which comes later in the
    // markup) exists yet, so getElementById would return null and the click
    // handler would never get attached.
    (function () {
        const toggle = document.getElementById('dashMobileToggle');
        const sidebar = document.getElementById('dashSidebar');
        const backdrop = document.getElementById('dashSidebarBackdrop');
        const dashLayout = document.querySelector('.dash-layout');
        const navbar = document.querySelector('.navbar');
        if (!toggle || !sidebar) return;

        function setMenuOpen(open) {
            // .dash-sidebar normally lives inside .page-scroll, which base.css
            // seals into its own stacking context at z-index:1 (see the
            // comment there) - so it has to escape .page-scroll to sit above
            // the navbar while open. Escaping to <body> would only trade one
            // trap for another: .navbar is itself a positioned element with
            // its own z-index, so it seals its OWN stacking context too, and
            // a body-level sidebar can only ever out-rank ".navbar" as a
            // whole - which buries dashMobileToggle, the only way to close
            // the thing, underneath it. Reparenting into .navbar instead -
            // exactly where the public site's off-canvas nav already lives
            // relative to its own toggle - keeps the sidebar/backdrop and the
            // toggle compared inside the SAME stacking context, so the
            // toggle's higher z-index (see dashboard.css) actually keeps it
            // on top and clickable, while .navbar as a whole still out-ranks
            // .page-scroll's ordinary content exactly as it always did.
            if (open) {
                if (navbar) {
                    if (sidebar.parentElement !== navbar) navbar.appendChild(sidebar);
                    if (backdrop && backdrop.parentElement !== navbar) navbar.appendChild(backdrop);
                }
            } else if (dashLayout && sidebar.parentElement !== dashLayout) {
                // Put it back as the flex sidebar column so the desktop
                // layout still works if the viewport gets resized back up
                // without a reload.
                dashLayout.insertBefore(sidebar, dashLayout.firstChild);
            }

            sidebar.classList.toggle('open', open);
            toggle.classList.toggle('open', open);
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            if (backdrop) backdrop.classList.toggle('open', open);
            const scrollRoot = document.querySelector('.page-scroll');
            if (scrollRoot) scrollRoot.style.overflow = open ? 'hidden' : '';
        }

        toggle.addEventListener('click', function () {
            setMenuOpen(!sidebar.classList.contains('open'));
        });

        if (backdrop) {
            backdrop.addEventListener('click', function () { setMenuOpen(false); });
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && sidebar.classList.contains('open')) setMenuOpen(false);
        });

        sidebar.addEventListener('click', function (e) {
            if (e.target.closest('a')) setMenuOpen(false);
        });
    })();

    let iconCatalog = null;

    function glyph(codepointHex) {
        const span = document.createElement('span');
        span.className = 'mdi-glyph';
        if (codepointHex) span.textContent = String.fromCodePoint(parseInt(codepointHex, 16));
        return span;
    }

    function copyToClipboard(el) {
        navigator.clipboard.writeText(el.dataset.copy).then(() => {
            const original = el.innerHTML;
            el.innerHTML = '<i class="mdi mdi-check"></i>';
            setTimeout(() => { el.innerHTML = original; }, 1200);
        });
    }

    async function toggleIconPicker() {
        const picker = document.getElementById('icon-picker');
        if (picker.style.display !== 'none') { picker.style.display = 'none'; return; }
        picker.style.display = 'block';
        if (!iconCatalog) {
            const resp = await fetch('/dashboard/badges/icons');
            if (resp.ok) iconCatalog = await resp.json();
        }
        filterIcons();
        document.getElementById('icon-search').focus();
    }

    function filterIcons() {
        if (!iconCatalog) return;
        const q = document.getElementById('icon-search').value.trim().toLowerCase();
        const grid = document.getElementById('icon-grid');
        grid.innerHTML = '';
        let shown = 0;
        for (const icon of iconCatalog) {
            if (q && !icon.n.includes(q)) continue;
            if (++shown > 180) break;
            const cell = document.createElement('a');
            cell.href = '#';
            cell.className = 'icon-cell';
            cell.title = icon.n;
            cell.appendChild(glyph(icon.c));
            cell.onclick = (e) => { e.preventDefault(); selectIcon(icon); };
            grid.appendChild(cell);
        }
        if (!shown) grid.innerHTML = '<div style="color:var(--fg-subtle); font-size:13px; padding:8px;">No icons match.</div>';
    }

    function selectIcon(icon) {
        document.getElementById('badge-icon-input').value = icon.n;
        document.getElementById('badge-icon-preview').textContent = String.fromCodePoint(parseInt(icon.c, 16));
        document.getElementById('icon-picker').style.display = 'none';
    }

    // Sidebar active-state (click-driven, since content now swaps instead of
    // scrolling past every section) plus direct-link support: reloading or
    // bookmarking /dashboard#beta-keys re-fetches that section on load,
    // since the hash itself never reaches the server.
    (function () {
        const links = document.querySelectorAll('.dash-nav-link');

        function activate(link) {
            links.forEach((l) => l.classList.remove('active'));
            link.classList.add('active');
        }

        links.forEach((link) => link.addEventListener('click', () => activate(link)));

        const hash = window.location.hash.replace('#', '');
        if (!hash || hash === 'profile') return;
        const match = document.querySelector('.dash-nav-link[data-section="' + hash + '"]');
        if (match && window.htmx) {
            activate(match);
            htmx.ajax('GET', match.getAttribute('hx-get'), { target: '#dash-content', swap: 'innerHTML' });
        }
    })();

    // Badge creation modal - lives inside the badges fragment itself, so these
    // just look elements up by id at call time rather than binding once, and
    // work fine however that fragment got onto the page (initial load or an
    // htmx swap).
    // The backdrop is a real fixed, full-viewport element with a higher
    // z-index than the navbar, so it should already sit on top of it and
    // intercept clicks by itself - but rather than lean on that stacking
    // argument, the navbar (and the dashboard's own sidebar) get their
    // pointer-events switched off directly while a modal is open. That way
    // "unclickable" doesn't depend on z-index math holding up everywhere.
    function setChromeInert(inert) {
        const navbar = document.querySelector('.navbar');
        const sidebar = document.querySelector('.dash-sidebar');
        if (navbar) navbar.style.pointerEvents = inert ? 'none' : '';
        if (sidebar) sidebar.style.pointerEvents = inert ? 'none' : '';
    }

    // .page-scroll (an ancestor of this modal) is forced into position:relative
    // + z-index:1 by a sitewide rule that just wants ordinary content to sit
    // above the ambient background - but that seals .page-scroll into its own
    // stacking context at level 1. No z-index inside it, however high, can
    // ever out-rank the navbar (z-index:100) from in there - the whole
    // subtree is capped at 1 when compared against that sibling. The fix is
    // to reparent the modal to <body> itself so its own z-index (see
    // dashboard.css - and note base.css's blanket rule explicitly excludes
    // .modal/.modal-backdrop so it isn't just re-trapped one level up).
    function openBadgeModal() {
        const backdrop = document.getElementById('badge-modal-backdrop');
        const modal = document.getElementById('badge-modal');
        if (backdrop && backdrop.parentElement !== document.body) document.body.appendChild(backdrop);
        if (modal && modal.parentElement !== document.body) document.body.appendChild(modal);
        backdrop?.classList.add('open');
        modal?.classList.add('open');
        const scrollRoot = document.querySelector('.page-scroll');
        if (scrollRoot) scrollRoot.style.overflow = 'hidden';
        setChromeInert(true);
    }

    function closeBadgeModal() {
        document.getElementById('badge-modal-backdrop')?.classList.remove('open');
        document.getElementById('badge-modal')?.classList.remove('open');
        const scrollRoot = document.querySelector('.page-scroll');
        if (scrollRoot) scrollRoot.style.overflow = '';
        setChromeInert(false);
    }

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeBadgeModal();
    });

    // A successful (or failed) create-badge submit swaps the whole badges
    // fragment back in, which silently discards the open modal along with
    // whatever else was there - the scroll lock and the disabled navbar
    // above wouldn't know to release on their own since closeBadgeModal()
    // never actually ran.
    document.addEventListener('htmx:afterSwap', function () {
        const scrollRoot = document.querySelector('.page-scroll');
        if (scrollRoot) scrollRoot.style.overflow = '';
        setChromeInert(false);
    });

    // The reparented modal (see openBadgeModal above) lives directly under
    // <body>, outside #dash-content - so swapping #dash-content's fragment
    // back in leaves it sitting there, orphaned, while the fresh fragment
    // brings its own #badge-modal/#badge-modal-backdrop pair with the same
    // ids. Drop the stale, reparented one before the new one ever lands.
    document.addEventListener('htmx:beforeSwap', function () {
        document.querySelectorAll('body > #badge-modal-backdrop, body > #badge-modal').forEach(function (el) { el.remove(); });
    });
</script>
</th:block>
</html>
