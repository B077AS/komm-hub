<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <script th:src="@{/js/htmx.min.js}" defer></script>
</head>

<th:block layout:fragment="body">

<nav class="navbar">
    <div class="navbar-content">
        <a class="nav-logo" href="/"><img th:src="@{/favicon.svg}" alt="Komm logo"> Komm</a>
        <div class="nav-user-menu">
            <button type="button" class="nav-user-trigger" id="navUserMenuButton"
                    aria-haspopup="true" aria-expanded="false" aria-controls="navUserDropdownMenu">
                <span class="nav-user-avatar">
                    <img th:if="${user.avatar}"
                         th:src="'data:image/' + ${user.avatarImageFormat ?: 'png'} + ';base64,' + ${user.avatar}"
                         alt="">
                    <span th:unless="${user.avatar}"
                          th:text="${#strings.isEmpty(user.username) ? '?' : #strings.toUpperCase(#strings.substring(user.username,0,1))}"></span>
                </span>
                <i class="mdi mdi-chevron-down"></i>
            </button>

            <div class="nav-user-dropdown" id="navUserDropdownMenu">
                <div class="nav-user-dropdown-name" th:text="${user.username}">username</div>
                <div class="nav-user-dropdown-divider"></div>
                <form method="post" th:action="@{/logout}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="nav-user-dropdown-item">
                        <i class="mdi mdi-logout"></i> Log out
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const userMenuButton = document.getElementById('navUserMenuButton');
            const userDropdownMenu = document.getElementById('navUserDropdownMenu');
            if (!userMenuButton || !userDropdownMenu) return;

            userMenuButton.addEventListener('click', function (e) {
                e.stopPropagation();
                const open = userDropdownMenu.classList.toggle('open');
                userMenuButton.setAttribute('aria-expanded', open ? 'true' : 'false');
            });

            document.addEventListener('click', function (e) {
                if (!userMenuButton.contains(e.target) && !userDropdownMenu.contains(e.target)) {
                    userDropdownMenu.classList.remove('open');
                    userMenuButton.setAttribute('aria-expanded', 'false');
                }
            });
        })();
    </script>
</nav>

<div class="page-scroll">
<div class="page-content">
<!-- hx-target/hx-swap set once here - every hx-get/hx-post underneath
     (sidebar links, the four admin action forms) inherits them unless it
     overrides its own, so #dash-content is the one thing that ever swaps. -->
<div class="dash-layout" hx-target="#dash-content" hx-swap="innerHTML">
    <nav class="dash-sidebar" aria-label="Dashboard sections">
        <a href="#profile" class="dash-nav-link active" data-section="profile"
           th:attr="hx-get=@{/dashboard/section/profile}, hx-push-url=(@{/dashboard} + '#profile')">
            <i class="mdi mdi-account-outline"></i> Profile
        </a>

        <th:block th:if="${isAdmin}">
            <div class="dash-nav-group">Super admin</div>
            <a href="#beta-keys" class="dash-nav-link" data-section="beta-keys"
               th:attr="hx-get=@{/dashboard/section/beta-keys}, hx-push-url=(@{/dashboard} + '#beta-keys')">
                <i class="mdi mdi-key-chain-variant"></i> Beta keys
            </a>
            <a href="#badges" class="dash-nav-link" data-section="badges"
               th:attr="hx-get=@{/dashboard/section/badges}, hx-push-url=(@{/dashboard} + '#badges')">
                <i class="mdi mdi-seal"></i> Badges
            </a>
        </th:block>
    </nav>

    <!-- Swap target: only the currently chosen section lives here, fetched
         from dashboard-fragments.html. Profile is inserted directly for the
         first paint so a plain GET /dashboard still renders a complete page
         with no extra round trip. -->
    <div class="dash-main" id="dash-content">
        <div th:replace="~{dashboard-fragments :: profile}"></div>
    </div>
</div>
</div>
</div>

<script>
    // Everything above is server-rendered - the only client-side JS left is UI-local
    // (clipboard copy, the icon picker's live search) or one lazy, session-cookie-
    // authenticated lookup for the large icon catalog. No bearer token anywhere.
    let iconCatalog = null;

    function glyph(codepointHex) {
        const span = document.createElement('span');
        span.className = 'mdi-glyph';
        if (codepointHex) span.textContent = String.fromCodePoint(parseInt(codepointHex, 16));
        return span;
    }

    function copyToClipboard(el) {
        navigator.clipboard.writeText(el.dataset.copy).then(() => {
            const original = el.innerHTML;
            el.innerHTML = '<i class="mdi mdi-check"></i>';
            setTimeout(() => { el.innerHTML = original; }, 1200);
        });
    }

    async function toggleIconPicker() {
        const picker = document.getElementById('icon-picker');
        if (picker.style.display !== 'none') { picker.style.display = 'none'; return; }
        picker.style.display = 'block';
        if (!iconCatalog) {
            const resp = await fetch('/dashboard/badges/icons');
            if (resp.ok) iconCatalog = await resp.json();
        }
        filterIcons();
        document.getElementById('icon-search').focus();
    }

    function filterIcons() {
        if (!iconCatalog) return;
        const q = document.getElementById('icon-search').value.trim().toLowerCase();
        const grid = document.getElementById('icon-grid');
        grid.innerHTML = '';
        let shown = 0;
        for (const icon of iconCatalog) {
            if (q && !icon.n.includes(q)) continue;
            if (++shown > 180) break;
            const cell = document.createElement('a');
            cell.href = '#';
            cell.className = 'icon-cell';
            cell.title = icon.n;
            cell.appendChild(glyph(icon.c));
            cell.onclick = (e) => { e.preventDefault(); selectIcon(icon); };
            grid.appendChild(cell);
        }
        if (!shown) grid.innerHTML = '<div style="color:var(--fg-subtle); font-size:13px; padding:8px;">No icons match.</div>';
    }

    function selectIcon(icon) {
        document.getElementById('badge-icon-input').value = icon.n;
        document.getElementById('badge-icon-preview').textContent = String.fromCodePoint(parseInt(icon.c, 16));
        document.getElementById('icon-picker').style.display = 'none';
    }

    // Sidebar active-state (click-driven, since content now swaps instead of
    // scrolling past every section) plus direct-link support: reloading or
    // bookmarking /dashboard#beta-keys re-fetches that section on load,
    // since the hash itself never reaches the server.
    (function () {
        const links = document.querySelectorAll('.dash-nav-link');

        function activate(link) {
            links.forEach((l) => l.classList.remove('active'));
            link.classList.add('active');
        }

        links.forEach((link) => link.addEventListener('click', () => activate(link)));

        const hash = window.location.hash.replace('#', '');
        if (!hash || hash === 'profile') return;
        const match = document.querySelector('.dash-nav-link[data-section="' + hash + '"]');
        if (match && window.htmx) {
            activate(match);
            htmx.ajax('GET', match.getAttribute('hx-get'), { target: '#dash-content', swap: 'innerHTML' });
        }
    })();
</script>
</th:block>
</html>
