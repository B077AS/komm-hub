<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="site-navbar">
    <div class="site-navbar-content">
        <!-- Logo -->
        <a th:href="@{/}" class="site-navbar-logo" aria-label="Komm home">
            <img th:src="@{/favicon.svg}" alt="Komm logo" class="site-navbar-logo-icon">
            <span>Komm</span>
        </a>

        <!-- Navigation Links -->
        <div class="site-navbar-links" id="navbarLinks">
            <a th:href="@{/#features}" class="site-navbar-link">Features</a>
            <a th:href="@{/#platforms}" class="site-navbar-link">Platforms</a>
            <a th:href="@{/#self-hosting}" class="site-navbar-link">Self-Hosting</a>
            <a th:href="@{/#security}" class="site-navbar-link">Security</a>
            <a th:href="@{/#faq}" class="site-navbar-link">FAQ</a>
            <a th:href="@{/download}" class="site-navbar-link">Download</a>
        </div>

        <!-- Actions -->
        <div class="site-navbar-actions">
            <a th:href="${site.github.client}" class="site-navbar-github" target="_blank" rel="noopener"
               aria-label="Komm on GitHub">
                <i class="mdi mdi-github"></i>
            </a>

            <a th:if="${!isAuthenticated}" th:href="@{/login}" class="btn btn-ghost">Log in</a>

            <!-- User menu (shown when logged in) -->
            <div class="site-user-menu" th:if="${isAuthenticated}">
                <button type="button" class="site-user-trigger" id="siteUserMenuButton"
                        aria-haspopup="true" aria-expanded="false" aria-controls="siteUserDropdownMenu">
                    <span class="site-user-avatar">
                        <img th:if="${user.avatar}"
                             th:src="'data:image/' + ${user.avatarImageFormat ?: 'png'} + ';base64,' + ${user.avatar}"
                             alt="">
                        <span th:unless="${user.avatar}"
                              th:text="${#strings.isEmpty(user.username) ? '?' : #strings.toUpperCase(#strings.substring(user.username,0,1))}"></span>
                    </span>
                    <i class="mdi mdi-chevron-down"></i>
                </button>

                <div class="site-user-dropdown" id="siteUserDropdownMenu">
                    <div class="site-user-dropdown-name" th:text="${user.username}">username</div>
                    <div class="site-user-dropdown-divider"></div>
                    <a th:href="@{/dashboard}" class="site-user-dropdown-item">
                        <i class="mdi mdi-view-dashboard-outline"></i> Dashboard
                    </a>
                    <a href="javascript:void(0)" class="site-user-dropdown-item site-user-dropdown-item-danger"
                       onclick="document.getElementById('siteLogoutForm').submit()">
                        <i class="mdi mdi-logout"></i> Log out
                    </a>
                </div>

                <!-- Logout is a state-changing action - POST + CSRF, not a plain link -->
                <form id="siteLogoutForm" th:action="@{/logout}" method="post" style="display:none;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                </form>
            </div>
        </div>

        <!-- Mobile menu toggle -->
        <button class="site-navbar-mobile-toggle" id="mobileMenuToggle" aria-label="Toggle menu"
                aria-expanded="false" aria-controls="navbarLinks">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>

    <div class="site-navbar-backdrop" id="siteNavbarBackdrop"></div>

    <script>
        (function () {
            const toggle = document.getElementById('mobileMenuToggle');
            const links = document.getElementById('navbarLinks');
            const backdrop = document.getElementById('siteNavbarBackdrop');
            const main = document.querySelector('.site-main');
            if (!toggle || !links) return;

            function setMenuOpen(open) {
                links.classList.toggle('open', open);
                toggle.classList.toggle('open', open);
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                if (backdrop) backdrop.classList.toggle('open', open);
                // The sidebar overlays .site-main rather than displacing it, so that's the
                // scroll container that needs locking while it's open, not body/html.
                if (main) main.style.overflow = open ? 'hidden' : '';
            }

            toggle.addEventListener('click', function () {
                setMenuOpen(!links.classList.contains('open'));
            });

            if (backdrop) {
                backdrop.addEventListener('click', function () { setMenuOpen(false); });
            }

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && links.classList.contains('open')) setMenuOpen(false);
            });

            // Close the mobile menu when a link is chosen
            links.addEventListener('click', function (e) {
                if (e.target.closest('a')) setMenuOpen(false);
            });
        })();

        (function () {
            // "Download" is a real separate page - just compare paths. The
            // other links are #hash anchors into sections that only exist
            // on the homepage, so they're handled below instead, by
            // tracking scroll position rather than a fixed comparison.
            //
            // The section lookup has to wait for DOMContentLoaded: this
            // script runs the instant the parser reaches it, which is while
            // it's still inside <nav> at the very top of the page - long
            // before <section id="features"> and the rest, much further
            // down the same document, have been parsed into the DOM. Doing
            // the getElementById calls right away found nothing every time,
            // silently, since a page without those sections (e.g. /download)
            // legitimately has none either - the exact same trap the
            // dashboard's off-canvas sidebar script has a comment about.
            const links = document.querySelectorAll('.site-navbar-link');
            links.forEach(function (link) {
                const url = new URL(link.href);
                if (!url.hash && url.pathname === location.pathname) link.classList.add('active');
            });

            document.addEventListener('DOMContentLoaded', function () {
                const sectionLinks = Array.from(links).filter(function (link) { return new URL(link.href).hash; });
                const sections = sectionLinks
                    .map(function (link) { return { link: link, el: document.getElementById(new URL(link.href).hash.slice(1)) }; })
                    .filter(function (entry) { return entry.el; });

                // Empty on any page that doesn't have these sections (e.g.
                // /download) - nothing left to observe, so just stop there.
                if (!sections.length) return;

                // Counts a section "current" as soon as its top edge crosses
                // into the upper 30% of the viewport, and it stays current
                // until the NEXT section's top does the same - a wide,
                // forgiving band (not a thin slice partway down the screen)
                // so this fires reliably regardless of section height or
                // how fast the visitor scrolls.
                const observer = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        const match = sections.find(function (s) { return s.el === entry.target; });
                        if (!match) return;

                        if (entry.isIntersecting) {
                            sectionLinks.forEach(function (l) { l.classList.remove('active'); });
                            match.link.classList.add('active');
                            return;
                        }

                        // Only the first section's exit needs handling here - every
                        // other section's exit is already covered by the one below
                        // it entering (scrolling down) or the one above it re-entering
                        // (scrolling up). But #features has nothing above it, so when
                        // IT exits back out through the top (boundingClientRect.top > 0
                        // means it's now below the viewport's own top edge, i.e. we've
                        // scrolled back up past it to the hero), nothing else fires to
                        // clear the state - it would otherwise stay stuck "active"
                        // forever once you'd scrolled down even once.
                        if (match === sections[0] && entry.boundingClientRect.top > 0) {
                            sectionLinks.forEach(function (l) { l.classList.remove('active'); });
                        }
                    });
                }, { rootMargin: '0px 0px -70% 0px', threshold: 0 });

                sections.forEach(function (s) { observer.observe(s.el); });
            });
        })();

        (function () {
            const userMenuButton = document.getElementById('siteUserMenuButton');
            const userDropdownMenu = document.getElementById('siteUserDropdownMenu');
            if (!userMenuButton || !userDropdownMenu) return;

            userMenuButton.addEventListener('click', function (e) {
                e.stopPropagation();
                const open = userDropdownMenu.classList.toggle('open');
                userMenuButton.setAttribute('aria-expanded', open ? 'true' : 'false');
            });

            document.addEventListener('click', function (e) {
                if (!userMenuButton.contains(e.target) && !userDropdownMenu.contains(e.target)) {
                    userDropdownMenu.classList.remove('open');
                    userMenuButton.setAttribute('aria-expanded', 'false');
                }
            });
        })();
    </script>
</nav>
</body>
</html>
